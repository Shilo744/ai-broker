name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: "Linux libraries Qt needs without a screen"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: "Unit tests (scheduler, permissions, languages, catalog, downloads, platform layer)"
        run: |
          python tests/test_scheduler.py
          python tests/test_permissions.py
          python tests/test_i18n.py
          python tests/test_catalog.py
          python tests/test_download.py
          python tests/test_platform.py
      - name: Every module imports
        run: python -c "import aibroker.daemon, aibroker.gui, aibroker.mcp_server, aibroker.cli, aibroker.hardware, aibroker.system"
      - name: "End to end on a throw-away broker (queue, run anyway, setup, window)"
        run: |
          python tests/e2e_force.py
          python tests/e2e_setup.py
          python tests/e2e_wizard.py
